<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">检验申请的执行状态与费用状态</title>
  <desc id="desc">上方显示申请、接收、标本、检测审核、报告发布与调阅，下方显示费用生成、支付确认及按规则调整，两条线通过业务标识关联但不是一一对应。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b41}
      .heading{font-size:38px;font-weight:700}.section{font-size:28px;font-weight:700}.label{font-size:26px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#526579}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#587b73"/></marker>
    <marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5c7ea8"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="64" y="68" class="heading">一项检验，多条状态线：支付 ≠ 执行 ≠ 报告</text>
  <text x="64" y="112" class="note">虚构普通门诊案例 · 绿色为执行过程，蓝色为费用过程；实际顺序依医院规则而定</text>
  <text x="64" y="181" class="section">临床与医技执行</text>
  <g fill="#eaf6f1" stroke="#8cbfa8" stroke-width="2">
    <rect x="60" y="213" width="210" height="158" rx="14"/><rect x="312" y="213" width="210" height="158" rx="14"/>
    <rect x="564" y="213" width="210" height="158" rx="14"/><rect x="816" y="213" width="210" height="158" rx="14"/>
    <rect x="1068" y="213" width="210" height="158" rx="14"/><rect x="1320" y="213" width="210" height="158" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="165" y="260" class="label">申请已提交</text><text x="165" y="307" class="body">请求产生</text><text x="165" y="342" class="note">尚未执行</text>
    <text x="417" y="260" class="label">执行端接收</text><text x="417" y="307" class="body">确认任务</text><text x="417" y="342" class="note">接收 ≠ 完成</text>
    <text x="669" y="260" class="label">标本已接收</text><text x="669" y="307" class="body">核对与登记</text><text x="669" y="342" class="note">仍未出结果</text>
    <text x="921" y="260" class="label">检测与审核</text><text x="921" y="307" class="body">产生、核验结果</text><text x="921" y="342" class="note">未必已发布</text>
    <text x="1173" y="260" class="label">报告已发布</text><text x="1173" y="307" class="body">形成可用报告</text><text x="1173" y="342" class="note">保留版本信息</text>
    <text x="1425" y="260" class="label">临床可调阅</text><text x="1425" y="307" class="body">结果成功回传</text><text x="1425" y="342" class="note">按授权展示</text>
  </g>
  <g fill="none" stroke="#587b73" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M 277 292 H 304"/><path d="M 529 292 H 556"/><path d="M 781 292 H 808"/><path d="M 1033 292 H 1060"/><path d="M 1285 292 H 1312"/>
  </g>
  <path d="M 165 373 V 502 M 1173 373 V 502" stroke="#8194a7" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="270" y="404" width="1060" height="63" rx="12" fill="#f4f6f9"/>
  <text x="800" y="444" text-anchor="middle" class="body">通过患者、就诊与申请等标识关联；费用与执行不必一一对应</text>
  <text x="64" y="501" class="section">费用处理</text>
  <g fill="#eaf2fc" stroke="#86acd5" stroke-width="2">
    <rect x="60" y="527" width="410" height="138" rx="14"/><rect x="565" y="527" width="410" height="138" rx="14"/><rect x="1070" y="527" width="460" height="138" rx="14"/>
  </g>
  <g text-anchor="middle">
    <text x="265" y="578" class="label">费用生成 / 待支付</text><text x="265" y="624" class="body">依据计价与业务规则</text>
    <text x="770" y="578" class="label">支付确认 / 后续核对</text><text x="770" y="624" class="body">已支付不能证明已检验</text>
    <text x="1300" y="578" class="label">需要时按规则调整</text><text x="1300" y="624" class="body">结合执行事实处理取消与退费</text>
  </g>
  <g fill="none" stroke="#5c7ea8" stroke-width="2.5" marker-end="url(#bluearrow)"><path d="M 479 596 H 552"/><path d="M 984 596 H 1057"/></g>
  <rect x="60" y="710" width="1470" height="116" rx="14" fill="#fff5e4" stroke="#dfc496"/>
  <text x="86" y="754" class="section">排查“已缴费但没有结果”：沿不同过程分别查证</text>
  <text x="86" y="798" class="body">支付与回执 → 申请发送与接收 → 执行记录 → 报告发布与回传；不要用一个“完成”状态替代全部事实</text>
  <text x="64" y="871" class="note">原创教学图 · 虚线表示业务关联；费用框的箭头不规定所有场景必须依次发生</text>
</svg>
