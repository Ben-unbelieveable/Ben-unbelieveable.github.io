<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">HIS 与临床、医技系统的职责关系</title>
  <desc id="desc">广义 HIS 包含核心业务与临床医技等职责，狭义 HIS 常指核心业务。共同身份、字典和接口支持协同，框图不规定采购和部署边界。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172b41}
      .heading{font-size:38px;font-weight:700}.section{font-size:29px;font-weight:700}.label{font-size:27px;font-weight:600}.body{font-size:23px}.note{font-size:22px;fill:#526579}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#70859a"/></marker>
  </defs>
  <rect width="1600" height="960" fill="#fff"/>
  <text x="64" y="68" class="heading">HIS：先区分讨论范围，再理解系统分工</text>
  <text x="64" y="111" class="note">医院信息化职责示意 · 蓝色为核心业务，绿色为临床与医技</text>
  <rect x="32" y="145" width="1536" height="719" rx="22" fill="#fafcfe" stroke="#8194a7" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="64" y="190" class="section">广义 HIS：支持医院医疗服务与管理的信息系统群</text>
  <rect x="64" y="218" width="468" height="452" rx="16" fill="#eaf2fc" stroke="#86acd5" stroke-width="2"/>
  <text x="90" y="263" class="section">核心业务</text>
  <text x="90" y="299" class="note">狭义 HIS 的常见范围</text>
  <rect x="86" y="321" width="424" height="71" rx="10" fill="#fff"/>
  <text x="108" y="365" class="label">挂号与患者服务</text>
  <rect x="86" y="408" width="424" height="71" rx="10" fill="#fff"/>
  <text x="108" y="452" class="label">入出转与床位管理</text>
  <rect x="86" y="495" width="424" height="71" rx="10" fill="#fff"/>
  <text x="108" y="539" class="label">费用、支付与结算</text>
  <rect x="86" y="582" width="424" height="65" rx="10" fill="#fff"/>
  <text x="108" y="623" class="label">药品与相关业务</text>
  <rect x="574" y="218" width="962" height="452" rx="16" fill="#eaf6f1" stroke="#8cbfa8" stroke-width="2"/>
  <text x="602" y="263" class="section">临床与医技职责</text>
  <rect x="600" y="291" width="426" height="160" rx="12" fill="#fff"/>
  <text x="624" y="336" class="label">EMR / CIS</text>
  <text x="624" y="378" class="body">医疗记录、临床工作站</text>
  <text x="624" y="417" class="body">医嘱与诊疗过程</text>
  <rect x="1052" y="291" width="458" height="160" rx="12" fill="#fff"/>
  <text x="1076" y="336" class="label">LIS</text>
  <text x="1076" y="378" class="body">标本、检验、审核</text>
  <text x="1076" y="417" class="body">结果与实验室报告</text>
  <rect x="600" y="477" width="426" height="160" rx="12" fill="#fff"/>
  <text x="624" y="522" class="label">RIS / PACS</text>
  <text x="624" y="564" class="body">影像检查流程与报告</text>
  <text x="624" y="603" class="body">影像归档、传输与调阅</text>
  <rect x="1052" y="477" width="458" height="160" rx="12" fill="#fff"/>
  <text x="1076" y="522" class="label">护理与其他专科系统</text>
  <text x="1076" y="564" class="body">护理记录、手术麻醉等</text>
  <text x="1076" y="603" class="body">具体边界依医院而定</text>
  <path d="M 542 444 H 564" fill="none" stroke="#70859a" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path d="M 300 672 V 706 M 1054 672 V 706" fill="none" stroke="#8194a7" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="64" y="708" width="1472" height="122" rx="14" fill="#edf1f6" stroke="#c7d2df"/>
  <text x="90" y="751" class="section">协同基础：患者与就诊标识 · 基础字典 · 接口与状态交换</text>
  <text x="90" y="794" class="body">让“同一个人、同一次就诊、同一项请求”能在不同岗位间被正确关联</text>
  <text x="64" y="909" class="note">原创教学图 · 方框表示职责，不代表必须独立采购或部署；连线仅表示协同关系</text>
</svg>
